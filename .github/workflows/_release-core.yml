name: L1 Universal Release Core

on:
  workflow_call:
    inputs:
      mode:
        description: "prepare or publish"
        required: true
        type: string
      project_name:
        description: "Human-readable project name; required for publish"
        required: false
        default: ""
        type: string
      artifact_filename:
        description: "Final release file name; required for publish"
        required: false
        default: ""
        type: string
      release_number:
        description: "Numeric release version; required for publish"
        required: false
        default: ""
        type: string
    outputs:
      release_requested:
        description: "true when the push commit requests a release"
        value: ${{ jobs.prepare.outputs.requested }}
      release_number:
        description: "Next numeric release version"
        value: ${{ jobs.prepare.outputs.number }}

jobs:
  prepare:
    if: ${{ inputs.mode == 'prepare' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      requested: ${{ steps.gate.outputs.requested }}
      number: ${{ steps.version.outputs.number }}
    steps:
      - name: Check release request
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && printf '%s' "$COMMIT_MESSAGE" | grep -Fq '[release]'; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine next release version
        if: ${{ steps.gate.outputs.requested == 'true' }}
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAGS=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          LAST=$(printf '%s\n' "$RELEASE_TAGS" | sed -nE 's/^v([0-9]+)$/\1/p' | sort -n | tail -1)

          if [ -z "$LAST" ]; then
            LAST=0
            echo "No published stable numeric releases found; next release will be v1"
          else
            echo "Latest published stable numeric release: v$LAST"
          fi

          NEXT=$((LAST + 1))
          echo "number=$NEXT" >> "$GITHUB_OUTPUT"

  publish:
    if: ${{ inputs.mode == 'publish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate release inputs
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
          ARTIFACT_FILENAME: ${{ inputs.artifact_filename }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_NAME"
          [[ "$RELEASE_NUMBER" =~ ^[0-9]+$ ]]
          test -n "$ARTIFACT_FILENAME"

      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifact
          path: release-artifact

      - name: Validate artifact and calculate SHA-256
        id: hash
        env:
          ARTIFACT_FILENAME: ${{ inputs.artifact_filename }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="release-artifact/${ARTIFACT_FILENAME}"
          test -s "$FILE"
          SHA256=$(sha256sum "$FILE" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_NAME: ${{ inputs.project_name }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
          ARTIFACT_FILENAME: ${{ inputs.artifact_filename }}
          EXPECTED_SHA256: ${{ steps.hash.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="v${RELEASE_NUMBER}"
          FILE="release-artifact/${ARTIFACT_FILENAME}"
          VERIFY_DIR="$RUNNER_TEMP/release-verify"

          read_tag_sha() {
            TAG_JSON=""
            if TAG_JSON=$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>/dev/null); then
              printf '%s' "$TAG_JSON" | jq -r '.object.sha // empty'
            fi
          }

          delete_matching_tag() {
            TAG_SHA=$(read_tag_sha)
            if [ -z "$TAG_SHA" ]; then
              return 0
            fi
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_TAG points to unexpected commit $TAG_SHA"
              return 1
            fi
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" >/dev/null
          }

          verify_published_release() {
            RELEASE_JSON=$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
            IS_DRAFT=$(printf '%s' "$RELEASE_JSON" | jq -r '.draft')
            TARGET_COMMIT=$(printf '%s' "$RELEASE_JSON" | jq -r '.target_commitish')
            test "$IS_DRAFT" = "false"
            test "$TARGET_COMMIT" = "$GITHUB_SHA"

            rm -rf "$VERIFY_DIR"
            mkdir -p "$VERIFY_DIR"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT_FILENAME" --dir "$VERIFY_DIR"
            test -s "$VERIFY_DIR/$ARTIFACT_FILENAME"
            REMOTE_SHA256=$(sha256sum "$VERIFY_DIR/$ARTIFACT_FILENAME" | awk '{print $1}')
            test "$REMOTE_SHA256" = "$EXPECTED_SHA256"
          }

          EXISTING_RELEASE=""
          if EXISTING_RELEASE=$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>/dev/null); then
            EXISTING_DRAFT=$(printf '%s' "$EXISTING_RELEASE" | jq -r '.draft')
            EXISTING_TARGET=$(printf '%s' "$EXISTING_RELEASE" | jq -r '.target_commitish')
            EXISTING_ID=$(printf '%s' "$EXISTING_RELEASE" | jq -r '.id // empty')

            if [ "$EXISTING_TARGET" != "$GITHUB_SHA" ]; then
              echo "Release $RELEASE_TAG points to unexpected target $EXISTING_TARGET"
              exit 1
            fi

            if [ "$EXISTING_DRAFT" = "false" ]; then
              echo "Release $RELEASE_TAG already exists; verifying it for idempotent recovery"
              verify_published_release
              echo "Existing release matches the expected commit and artifact"
              exit 0
            fi

            echo "Recovering stale draft Release $RELEASE_TAG"
            test -n "$EXISTING_ID"

            TAG_SHA=$(read_tag_sha)
            if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Draft release tag $RELEASE_TAG points to unexpected commit $TAG_SHA"
              exit 1
            fi

            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/releases/$EXISTING_ID" >/dev/null
            delete_matching_tag
          fi

          TAG_SHA=$(read_tag_sha)
          if [ -n "$TAG_SHA" ]; then
            echo "Tag $RELEASE_TAG already exists without a matching release"
            exit 1
          fi

          BODY=$(printf 'Commit: `%s`\nArtifact: `%s`\nSHA-256: `%s`' "$GITHUB_SHA" "$ARTIFACT_FILENAME" "$EXPECTED_SHA256")

          RELEASE_JSON=$(gh api --method POST "/repos/$GITHUB_REPOSITORY/releases" -f "tag_name=$RELEASE_TAG" -f "target_commitish=$GITHUB_SHA" -f "name=$PROJECT_NAME $RELEASE_TAG" -f "body=$BODY" -F draft=true -F prerelease=false -F generate_release_notes=true)
          RELEASE_ID=$(printf '%s' "$RELEASE_JSON" | jq -r '.id // empty')
          test -n "$RELEASE_ID"

          PUBLISHED=false
          rollback_draft() {
            if [ "$PUBLISHED" != "true" ]; then
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >/dev/null 2>&1 || true
              delete_matching_tag >/dev/null 2>&1 || true
            fi
          }
          trap rollback_draft EXIT

          ASSET_NAME=$(jq -rn --arg value "$ARTIFACT_FILENAME" '$value|@uri')
          curl --silent --show-error --fail-with-body -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/octet-stream" --data-binary "@$FILE" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$ASSET_NAME" >/dev/null

          ASSETS=$(gh api "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100")
          ASSET_OK=$(printf '%s' "$ASSETS" | jq --arg name "$ARTIFACT_FILENAME" '[.[] | select(.name == $name and .size > 0)] | length')
          test "$ASSET_OK" = "1"

          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true >/dev/null
          PUBLISHED=true
          trap - EXIT

          verify_published_release
          echo "Published and verified GitHub Release $RELEASE_TAG"

      - name: Clean current run Actions artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          CLEANUP_FAILED=false
          ARTIFACT_IDS=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[].id')
          if [ $? -ne 0 ]; then
            echo "::warning::Could not list current run Actions artifacts"
            exit 0
          fi

          while read -r ARTIFACT_ID; do
            [ -z "$ARTIFACT_ID" ] && continue
            if ! gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" >/dev/null; then
              CLEANUP_FAILED=true
            fi
          done <<< "$ARTIFACT_IDS"

          if [ "$CLEANUP_FAILED" = "true" ]; then
            echo "::warning::Release processing completed, but some current-run Actions artifacts could not be deleted"
          fi
          exit 0

      - name: Write release publication summary
        if: success()
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
          ARTIFACT_FILENAME: ${{ inputs.artifact_filename }}
          ARTIFACT_SHA256: ${{ steps.hash.outputs.sha256 }}
        shell: bash
        run: |
          {
            echo "## Release publication"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            printf '| Project | `%s` |\n' "$PROJECT_NAME"
            printf '| Release | `v%s` |\n' "$RELEASE_NUMBER"
            printf '| Commit | `%s` |\n' "$GITHUB_SHA"
            printf '| Artifact | `%s` |\n' "$ARTIFACT_FILENAME"
            printf '| SHA-256 | `%s` |\n' "$ARTIFACT_SHA256"
            echo "| Verification | Published, downloaded back and SHA-256 verified |"
            echo "| Release | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$RELEASE_NUMBER |"
          } >> "$GITHUB_STEP_SUMMARY"
